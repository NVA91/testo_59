# ============================================================
# baseline-monitor.conf
# Zentrale Konfiguration für das Netzwerk-Baseline-Monitoring
# Nichts wird in den Skripten hartkodiert – alles hier anpassen!
# ============================================================

# ============================================================
# Netzwerk-Ziele
# ============================================================

# Komma-getrennte Liste von IPs/Hostnamen für Latenz-Tests (ping, mtr)
# Beispiele: Router (192.168.1.1), NAS, Google DNS (8.8.8.8), Cloudflare (1.1.1.1)
LATENCY_TARGETS="192.168.1.1,8.8.8.8,1.1.1.1"

# Netzwerk-Bereich für Host-Entdeckung (arp-scan / nmap)
# Beispiel für typische Heimnetzwerke: 192.168.1.0/24 oder 10.0.0.0/24
SCAN_NETWORK="192.168.1.0/24"

# Netzwerk-Interface für arp-scan (z.B. eth0, enp3s0, wlan0)
# Ermitteln mit: ip link show
SCAN_INTERFACE="eth0"

# ============================================================
# iPerf3 Bandbreiten-Test
# ============================================================

# IP des Rechners, der als iPerf3-Server läuft.
# Für Loopback-Test (ein einzelner Rechner): 127.0.0.1
# Für echten Netzwerktest: IP der Gegenstelle (z.B. 192.168.1.50)
IPERF3_SERVER_IP="127.0.0.1"

# iPerf3 Port (Standard: 5201)
IPERF3_PORT="5201"

# Testdauer in Sekunden pro Richtung
IPERF3_DURATION="10"

# ============================================================
# SSH-Automatisierung (Optional)
# Nur benötigt, wenn IPERF3_SERVER_IP ein anderer Rechner ist
# und der iperf3-Serverprozess automatisch gestartet werden soll.
# ============================================================

# SSH-Automatisierung aktivieren? (true/false)
SSH_ENABLED="false"

# SSH-Benutzername auf dem Gegenstellen-Rechner
SSH_USER="your_user"

# Pfad zum privaten SSH-Schlüssel (muss ohne Passphrase sein!)
# Einrichten: ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_baseline
# Schlüssel kopieren: ssh-copy-id -i ~/.ssh/id_baseline.pub user@server
SSH_KEY_PATH="/root/.ssh/id_ed25519"

# ============================================================
# Ping-Einstellungen
# ============================================================

# Anzahl der Ping-Pakete pro Ziel
PING_COUNT="10"

# Ping-Timeout in Sekunden (Wartezeit pro Paket)
PING_TIMEOUT="5"

# ============================================================
# MTR-Einstellungen
# ============================================================

# MTR aktivieren? (true/false) – benötigt das Paket mtr-tiny
MTR_ENABLED="true"

# Anzahl der MTR-Zyklen pro Ziel (mehr = genauere Statistik, dauert länger)
MTR_CYCLES="5"

# ============================================================
# vnstat (Datenvolumen-Monitoring)
# ============================================================

# vnstat aktivieren? (true/false)
VNSTAT_ENABLED="true"

# Netzwerk-Interface für vnstat (sollte mit SCAN_INTERFACE übereinstimmen)
VNSTAT_INTERFACE="eth0"

# ============================================================
# Logging
# ============================================================

# Verzeichnis für Log-Dateien (JSON) – wird automatisch angelegt
LOG_DIR="/var/log/baseline-monitor"

# Log-Aufbewahrung in Tagen (ältere Logs werden automatisch gelöscht)
LOG_RETENTION_DAYS="30"

# ============================================================
# Benachrichtigungen (Optional)
# ============================================================

# E-Mail-Benachrichtigungen aktivieren? (true/false)
NOTIFY_ENABLED="false"

# Empfänger-E-Mail-Adresse
NOTIFY_EMAIL=""

# SMTP-Einstellungen (z.B. für lokalen Postfix oder externen Relay)
SMTP_HOST="localhost"
SMTP_PORT="25"
SMTP_FROM="baseline-monitor@localhost"
